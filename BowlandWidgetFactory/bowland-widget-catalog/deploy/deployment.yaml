apiVersion: apps/v1
kind: Deployment
metadata:
  name: bowland-widget-catalog
  labels:
    bowland.com/environment: prod
    bowland.com/business-unit: sales
    bowland.com/app-name: bowland-widget-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      bowland.com/app-name: bowland-widget-catalog
  template:
    metadata:
      labels:
        bowland.com/environment: prod
        bowland.com/business-unit: sales
        bowland.com/app-name: bowland-widget-catalog
    spec:
      containers:
        - name: bowland-widget-catalog
          image: quay.io/cbowland/bowland-widget-catalog
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bowland-widget-catalog-secret
                  key: ADMIN_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
