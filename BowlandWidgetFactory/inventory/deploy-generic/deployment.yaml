apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  annotations:
    bowland.com/support-contact: inventory-team@bowland.com
  labels:
    bowland.com/environment: dev
    bowland.com/business-unit: retail
    bowland.com/app-name: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      bowland.com/app-name: inventory
  template:
    metadata:
      labels:
        bowland.com/environment: dev
        bowland.com/business-unit: retail
        bowland.com/app-name: inventory
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: quay.io/openshift/hello-openshift:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: MESSAGE
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inventory-secret
                  key: api-token
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
