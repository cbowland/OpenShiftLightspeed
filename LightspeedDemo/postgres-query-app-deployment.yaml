apiVersion: v1
kind: Secret
metadata:
  name: postgres-init-sql
  labels:
    app: fedora-postgres
type: Opaque
stringData:
  init.sql: |
    CREATE TABLE employees (
        id SERIAL PRIMARY KEY,
        first_name VARCHAR(50) NOT NULL,
        last_name VARCHAR(50) NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        department VARCHAR(50),
        hire_date DATE DEFAULT CURRENT_DATE,
        salary NUMERIC(10,2)
    );

    CREATE TABLE products (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        description TEXT,
        price NUMERIC(10,2) NOT NULL,
        stock_quantity INTEGER DEFAULT 0,
        category VARCHAR(50),
        created_at TIMESTAMP DEFAULT NOW()
    );

    CREATE TABLE orders (
        id SERIAL PRIMARY KEY,
        employee_id INTEGER REFERENCES employees(id),
        product_id INTEGER REFERENCES products(id),
        quantity INTEGER NOT NULL,
        total_price NUMERIC(10,2),
        order_date TIMESTAMP DEFAULT NOW(),
        status VARCHAR(20) DEFAULT 'pending'
    );

    INSERT INTO employees (first_name, last_name, email, department, hire_date, salary) VALUES
        ('Alice',   'Johnson',  'alice.johnson@example.com',  'Engineering',  '2022-03-15', 95000.00),
        ('Bob',     'Smith',    'bob.smith@example.com',      'Marketing',    '2021-07-01', 72000.00),
        ('Carol',   'Williams', 'carol.williams@example.com', 'Engineering',  '2023-01-10', 88000.00),
        ('David',   'Brown',    'david.brown@example.com',    'Sales',        '2020-11-20', 67000.00),
        ('Eve',     'Davis',    'eve.davis@example.com',      'Engineering',  '2024-06-01', 105000.00),
        ('Frank',   'Miller',   'frank.miller@example.com',   'HR',           '2019-09-12', 78000.00),
        ('Grace',   'Wilson',   'grace.wilson@example.com',   'Marketing',    '2023-04-18', 71000.00),
        ('Hank',    'Moore',    'hank.moore@example.com',     'Sales',        '2022-08-30', 69000.00);

    INSERT INTO products (name, description, price, stock_quantity, category) VALUES
        ('Laptop Pro 15',       'High-performance 15-inch laptop',           1299.99, 50,  'Electronics'),
        ('Wireless Mouse',      'Ergonomic wireless mouse with USB-C',       29.99,   200, 'Accessories'),
        ('Mechanical Keyboard', 'Cherry MX Blue switch mechanical keyboard', 89.99,   150, 'Accessories'),
        ('4K Monitor',          '27-inch 4K IPS display',                    449.99,  75,  'Electronics'),
        ('USB-C Hub',           '7-in-1 USB-C docking station',              59.99,   300, 'Accessories'),
        ('Standing Desk',       'Electric height-adjustable standing desk',  599.99,  30,  'Furniture'),
        ('Noise-Canceling Headphones', 'Over-ear ANC headphones',            199.99,  120, 'Electronics'),
        ('Webcam HD',           '1080p webcam with built-in microphone',     79.99,   180, 'Electronics');

    INSERT INTO orders (employee_id, product_id, quantity, total_price, status) VALUES
        (1, 1, 1, 1299.99, 'completed'),
        (1, 3, 1, 89.99,   'completed'),
        (2, 2, 2, 59.98,   'completed'),
        (3, 4, 1, 449.99,  'shipped'),
        (4, 5, 3, 179.97,  'pending'),
        (5, 6, 1, 599.99,  'completed'),
        (6, 7, 1, 199.99,  'shipped'),
        (7, 8, 2, 159.98,  'pending'),
        (2, 1, 1, 1299.99, 'completed'),
        (8, 3, 1, 89.99,   'shipped');

    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO appuser;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO appuser;
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-postgres-vm
  labels:
    app: fedora-postgres
spec:
  running: true
  template:
    metadata:
      labels:
        app: fedora-postgres
        kubevirt.io/domain: fedora-postgres-vm
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: sql-init-disk
              serial: SQLINIT
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: sql-init-disk
          secret:
            secretName: postgres-init-sql
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config

              user: admin
              password: admin
              chpasswd:
                expire: false
              ssh_pwauth: true

              users:
                - name: admin
                  plain_text_passwd: admin
                  lock_passwd: false
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  groups: wheel

              packages:
                - postgresql-server
                - postgresql-contrib
                - python3-psycopg2
                - firewalld

              runcmd:
                - postgresql-setup --initdb
                - sed -i "s/^#listen_addresses = 'localhost'/listen_addresses = '*'/" /var/lib/pgsql/data/postgresql.conf
                - sed -i "s/^listen_addresses = 'localhost'/listen_addresses = '*'/" /var/lib/pgsql/data/postgresql.conf
                - systemctl enable postgresql
                - systemctl start postgresql
                - systemctl enable firewalld
                - systemctl start firewalld
                - firewall-cmd --permanent --add-service=postgresql
                - firewall-cmd --reload
                - sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'pgpassword';"
                - sudo -u postgres psql -c "CREATE USER appuser WITH PASSWORD 'apppassword' CREATEDB;"
                - sudo -u postgres psql -c "CREATE DATABASE sampledb OWNER appuser;"
                - mkdir -p /mnt/sql-init
                - mount /dev/disk/by-id/virtio-SQLINIT /mnt/sql-init
                - sudo -u postgres psql -d sampledb -f /mnt/sql-init/init.sql
                - umount /mnt/sql-init
                - echo "host    all    all    0.0.0.0/0    scram-sha-256" >> /var/lib/pgsql/data/pg_hba.conf
                - echo "host    all    all    ::/0         scram-sha-256" >> /var/lib/pgsql/data/pg_hba.conf
                - sed -i 's/^host\s\+all\s\+all\s\+127.0.0.1\/32\s\+ident/host    all             all             127.0.0.1\/32            scram-sha-256/' /var/lib/pgsql/data/pg_hba.conf
                - sed -i 's/^host\s\+all\s\+all\s\+::1\/128\s\+ident/host    all             all             ::1\/128                 scram-sha-256/' /var/lib/pgsql/data/pg_hba.conf
                - systemctl reload postgresql

              final_message: "Cloud-init complete. PostgreSQL is running and accepting remote connections on port 5432."
---
apiVersion: v1
kind: Service
metadata:
  name: fedora-postgres-svc
spec:
  selector:
    app: fedora-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-console
  labels:
    app: query-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-console
  template:
    metadata:
      labels:
        app: query-console
    spec:
      containers:
        - name: query-console
          image: quay.io/cbowland/query-console:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              value: "fedora-postgres-svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "sampledb"
            - name: DB_USER
              value: "appuser"
            - name: DB_PASSWORD
              value: "apppassword"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: query-console
  labels:
    app: query-console
spec:
  selector:
    app: query-console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: query-console
  labels:
    app: query-console
spec:
  to:
    kind: Service
    name: query-console
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
